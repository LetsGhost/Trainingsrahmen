<!doctype html>
<!-- Vorlage für scripts/boot/splash.png (Boot-Splash 4A „Dunkel“ aus Splashscreen.dc.html, 1024 × 600 mit ≈ 0,78 auf 800 × 480).
     Ohne den laufenden Balken: Den zeichnet Plymouth (trainingsrahmen.script) über die Spur unten.
     Neu rendern: scripts/boot/render-splash.sh -->
<html lang="de">
<head>
<meta charset="utf-8">
<style>
  @font-face {
    font-family: "Archivo";
    src: url("../../display/assets/fonts/Archivo-latin.woff2") format("woff2");
    font-weight: 100 900;
  }
  html, body { margin: 0; width: 800px; height: 480px; overflow: hidden; }
  body {
    background: #1a1918; color: #f3f2f2;
    font-family: "Archivo", sans-serif; -webkit-font-smoothing: antialiased;
    display: flex; flex-direction: column; justify-content: flex-end;
  }
  .brand { display: flex; flex-direction: column; gap: 17px; padding: 0 37px 34px; }
  .accent { width: 44px; height: 6px; background: #ff563c; }
  h1 { margin: 0; font-size: 81px; font-weight: 900; line-height: 0.86; letter-spacing: -0.05em; }
  .rule { height: 2px; background: rgba(243, 242, 242, 0.32); }
  .foot { display: flex; justify-content: space-between; padding: 12px 37px; font-size: 9.5px; font-weight: 800; letter-spacing: 0.18em; }
  .track { height: 5px; background: rgba(243, 242, 242, 0.12); }
</style>
</head>
<body>
  <div class="brand">
    <div class="accent"></div>
    <h1>Trainings-<br>rahmen</h1>
  </div>
  <div class="rule"></div>
  <div class="foot"><span style="color:#bab6b6">STARTET …</span><span style="color:#7d7979">V 1.0</span></div>
  <div class="track"></div>
</body>
</html>
