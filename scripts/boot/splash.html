<!doctype html>
<!-- Vorlage für scripts/boot/splash-1..3.png (Boot-Screen 5B „Monogramm + Punkte“, 800 × 480).
     #1, #2, #3 = Anzahl aktiver Punkte; Plymouth (trainingsrahmen.script) schaltet die Bilder reihum.
     Neu rendern: scripts/boot/render-splash.sh -->
<html lang="de">
<head>
<meta charset="utf-8">
<style>
  @font-face {
    font-family: "Archivo";
    src: url("../../display/assets/fonts/Archivo-latin.woff2") format("woff2");
    font-weight: 100 900;
  }
  :root { --bg: #111111; --fg: #ededed; --dot-off: #3a3a3a; --mark-size: 26px; }
  html, body { margin: 0; width: 800px; height: 480px; overflow: hidden; background: var(--bg); }
  body {
    color: var(--fg); font-family: "Archivo", system-ui, sans-serif; -webkit-font-smoothing: antialiased;
    display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 30px;
  }
  .mark { display: flex; align-items: stretch; gap: calc(var(--mark-size) * 0.42); }
  .mark__bar { width: 4px; background: var(--fg); }
  .mark__letters {
    display: flex; flex-direction: column; gap: calc(var(--mark-size) * 0.28);
    font-size: var(--mark-size); font-weight: 800; line-height: 0.74; padding-top: 1px;
  }
  .dots { display: flex; gap: 8px; }
  .dot { width: 6px; height: 6px; border-radius: 50%; background: var(--dot-off); }
  .dot.is-on { background: var(--fg); }
</style>
</head>
<body>
  <div class="mark"><div class="mark__bar"></div><div class="mark__letters"><div>P</div><div>M</div></div></div>
  <div class="dots"><span class="dot"></span><span class="dot"></span><span class="dot"></span></div>
  <script>
    const n = Number(location.hash.slice(1)) || 0;
    document.querySelectorAll(".dot").forEach((d, i) => d.classList.toggle("is-on", i < n));
  </script>
</body>
</html>
